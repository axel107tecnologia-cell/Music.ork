name: Construir APK Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Instalar componentes del SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Encontrar y compilar el proyecto
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _build_src
          PROJECT_DIR=""
          ZIP_COUNT=0

          while IFS= read -r ZIP_FILE; do
            ZIP_COUNT=$((ZIP_COUNT + 1))
            CANDIDATE="_build_src/candidate_${ZIP_COUNT}"
            mkdir -p "$CANDIDATE"

            if ! unzip -q "\(ZIP_FILE" -d "\)CANDIDATE"; then
              echo "Ignoro un ZIP que no se pudo extraer: $ZIP_FILE"
              continue
            fi

            SETTINGS_FILE="\((find "\)CANDIDATE" -type f -name settings.gradle.kts -print -quit)"
            if [ -z "$SETTINGS_FILE" ]; then
              continue
            fi

            CANDIDATE_PROJECT="\((dirname "\)SETTINGS_FILE")"
            if [ -f "$CANDIDATE_PROJECT/app/build.gradle.kts" ]; then
              PROJECT_DIR="$CANDIDATE_PROJECT"
              echo "Proyecto completo encontrado en: $ZIP_FILE"
              break
            fi
          done < <(find . -maxdepth 1 -type f -iname '*.zip' -print)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Ningún ZIP de la raíz contiene settings.gradle.kts y app/build.gradle.kts juntos."
            exit 1
          fi

          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace --no-daemon

      - name: Guardar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: AO-MUSIC-ORK404-APK
          path: _build_src/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
