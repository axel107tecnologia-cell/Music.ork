name: Construir APK Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Instalar componentes del SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Encontrar y compilar el proyecto
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import subprocess
          import zipfile

          os.makedirs("_build_src", exist_ok=True)
          project_dir = None

          for archive in glob.glob("./*.zip"):
              destination = os.path.join(
                  "_build_src",
                  os.path.basename(archive) + "_contents"
              )
              os.makedirs(destination, exist_ok=True)

              try:
                  with zipfile.ZipFile(archive) as zipped:
                      names = set(zipped.namelist())
                      prefix_found = None

                      for settings_file in names:
                          if settings_file.endswith("settings.gradle.kts"):
                              prefix = settings_file[:-len("settings.gradle.kts")]
                              app_build_file = prefix + "app/build.gradle.kts"

                              if app_build_file in names:
                                  prefix_found = prefix
                                  break

                      if prefix_found is None:
                          print(f"El ZIP no tiene la estructura esperada: {archive}")
                          continue

                      zipped.extractall(destination)
                      project_dir = os.path.abspath(
                          os.path.join(destination, prefix_found.rstrip("/"))
                      )
                      print(f"Proyecto encontrado en: {archive}")
                      break

              except zipfile.BadZipFile:
                  print(f"El archivo no es un ZIP válido: {archive}")

          if project_dir is None:
              raise SystemExit(
                  "No encontré un ZIP que contenga settings.gradle.kts "
                  "y app/build.gradle.kts."
              )

          subprocess.run(
              ["gradle", "assembleDebug", "--stacktrace", "--no-daemon"],
              cwd=project_dir,
              check=True
          )
          PY

      - name: Guardar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: AO-MUSIC-ORK404-APK
          path: _build_src/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
