name: Construir APK Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer el proyecto del ZIP
        run: |
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "No encuentro el ZIP del proyecto en la raíz del repositorio."
            exit 1
          fi
          mkdir -p _build_src
          unzip -q "$ZIP" -d _build_src
          PROJECT_DIR="\((dirname "\)(find _build_src -type f -name settings.gradle.kts -print -quit)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "No encuentro settings.gradle.kts dentro del ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=\(PROJECT_DIR" >> "\)GITHUB_ENV"

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: AO-MUSIC-ORK404-APK
          path: _build_src/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
