name: Construir APK Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Instalar componentes del SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer y compilar el proyecto
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No encuentro el ZIP del proyecto en la raíz del repositorio."
            exit 1
          fi

          mkdir -p _build_src
          unzip -q "$ZIP_FILE" -d _build_src

          SETTINGS_FILE="$(find _build_src -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "El ZIP no contiene settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR="\((dirname "\)SETTINGS_FILE")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "No encuentro app/build.gradle.kts dentro del proyecto."
            exit 1
          fi

          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace --no-daemon

      - name: Guardar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: AO-MUSIC-ORK404-APK
          path: _build_src/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
